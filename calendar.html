<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal Calendar – Campus Event Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">Campus Event Pro</a>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="calendar.html" class="nav-link active">Calendar</a></li>
        <li><a href="events.html" class="nav-link">Events</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      </ul>
      <div class="nav-actions"></div>
    </div>
  </nav>

  <main class="container">
    <div class="calendar-page-layout">
      <!-- Calendar Filters Sidebar -->
      <aside class="calendar-sidebar">
        <h3>📅 Internal Calendar</h3>
        <p style="font-size:0.85rem; color:var(--text-muted);">Filter events across departments, categories, and schedules.</p>

        <div class="form-group">
          <label class="form-label">Department</label>
          <select id="calendar-dept-filter" class="form-control">
            <option value="All">All Departments</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Placement Cell">Placement Cell</option>
            <option value="Cultural Club">Cultural Club</option>
            <option value="Physical Education">Physical Education</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="calendar-cat-filter" class="form-control">
            <option value="All">All Categories</option>
            <option value="Hackathon">Hackathon</option>
            <option value="Cultural">Cultural</option>
            <option value="Technical">Technical</option>
            <option value="Sports">Sports</option>
            <option value="Workshop">Workshop</option>
            <option value="Placement">Placement</option>
          </select>
        </div>

        <div style="margin-top:auto; padding-top:1rem; border-top:1px solid var(--border-color);">
          <h4 style="font-size:0.85rem; margin-bottom:0.5rem;">Category Color Legend</h4>
          <div style="display:flex; flex-direction:column; gap:0.35rem; font-size:0.8rem; color:var(--text-muted);">
            <div><span style="display:inline-block; width:12px; height:12px; background:#f59e0b; border-radius:2px;"></span> Hackathon</div>
            <div><span style="display:inline-block; width:12px; height:12px; background:#ec4899; border-radius:2px;"></span> Cultural</div>
            <div><span style="display:inline-block; width:12px; height:12px; background:#3b82f6; border-radius:2px;"></span> Technical</div>
            <div><span style="display:inline-block; width:12px; height:12px; background:#10b981; border-radius:2px;"></span> Sports</div>
            <div><span style="display:inline-block; width:12px; height:12px; background:#8b5cf6; border-radius:2px;"></span> Workshop</div>
          </div>
        </div>
      </aside>

      <!-- Calendar Main Renderer -->
      <section>
        <div class="calendar-controls">
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <button id="prev-month-btn" class="btn btn-secondary btn-sm">◀</button>
            <h2 id="calendar-month-year" style="font-size:1.4rem; min-width:180px;">Month Year</h2>
            <button id="next-month-btn" class="btn btn-secondary btn-sm">▶</button>
            <button id="today-btn" class="btn btn-outline btn-sm">Today</button>
          </div>

          <div class="view-switcher">
            <button class="view-btn active" data-view="month">Month</button>
            <button class="view-btn" data-view="week">Week</button>
            <button class="view-btn" data-view="day">Day</button>
            <button class="view-btn" data-view="year">Year</button>
          </div>
        </div>

        <div id="calendar-grid" class="calendar-grid">
          <!-- Calendar Grid JS rendered here -->
        </div>
      </section>
    </div>
  </main>

  <!-- Interactive Event Popup Modal -->
  <div id="event-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-event-title">Event Title</h3>
        <button class="modal-close" onclick="closeEventModal()">&times;</button>
      </div>
      <p id="modal-event-dept" class="badge badge-tech" style="margin-bottom:1rem;"></p>
      <p id="modal-event-time" style="font-size:0.9rem; color:var(--text-muted); margin-bottom:0.5rem;"></p>
      <p id="modal-event-venue" style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1rem;"></p>
      <p id="modal-event-desc" style="font-size:0.95rem; line-height:1.6; margin-bottom:1.5rem;"></p>
      <p id="modal-event-seats" style="font-weight:600; font-size:0.9rem; margin-bottom:1.5rem;"></p>
      <div style="display:flex; justify-content:flex-end; gap:0.75rem;">
        <button class="btn btn-secondary btn-sm" onclick="closeEventModal()">Close</button>
        <a id="modal-event-link" href="#" class="btn btn-primary btn-sm">Go to Event Page</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
