services:
  - type: web
    name: campus-event-pro-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./campus_event_pro.db
      - key: CORS_ORIGINS
        value: "*"
